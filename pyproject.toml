# ==================================================================================================
# Pyproject Configuration for the Stelion Package
# ==================================================================================================

# --- Build System Requirements --------------------------------------------------------------------

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# --- Package Metadata -----------------------------------------------------------------------------

[project]
name = "stelion"
version = "0.0.0"
authors = [{name = "Esther Poniatowski", email = "esther.poniatowski@ens.psl.eu"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
description = "Keeps multiple Python projects consistent within a shared workspace."
keywords = ["workspace", "project-discovery", "vscode", "conda", "bootstrapping", "dependency-graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]
urls = {homepage = "https://github.com/esther-poniatowski/stelion"}


# --- Dependencies ---------------------------------------------------------------------------------

requires-python = ">=3.12"

dependencies = [
    "pyyaml",            # YAML configuration parsing
    "typer",             # CLI interface
    "rich",              # Improved CLI output formatting
    # The root of a workspace and the places of stelion.yml are located by Hodegos.
    "hodegos @ git+https://github.com/esther-poniatowski/hodegos.git@e61d0d97eaa80cc0cfdd90c3022c1e3916ef1ad9",
]

[project.optional-dependencies]
# The command `stelion layout check` reads the metadata, the links and the exclusions of a
# repository through the read package of Anagraphe, and checks a layout against its schema.
layout = [
    "jsonschema>=4.18",
    "anagraphe-read @ git+https://github.com/esther-poniatowski/anagraphe.git@cb0ffc685d0ccc58b67ddb8f08936d750de5f7f2#subdirectory=packages/read-python",
]
# The tests check the findings log of the layout check with the profile interface of Elenchos.
test = [
    "elenchos @ git+https://github.com/esther-poniatowski/elenchos.git@4141cc82978a8e1ebba23b9c92af71691cffe954",
]


# --- Package Source Code --------------------------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Include non-Python data files shipped with the package
[tool.setuptools.package-data]
stelion = [
    "data/**/*.json",
    "schemas/*.json",
    "layouts/*.yml",
]

# --- CLI Entry Points -----------------------------------------------------------------------------

[project.scripts]
stelion = "stelion.cli:app"

# --- Tool Configurations --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
