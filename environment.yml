name: stelion
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Data manipulation and formats
  - pyyaml
  - types-pyyaml
  # Development tools
  - black
  - mypy
  - mypy_extensions
  - pylint
  - pyright
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint
  # Documentation
  - sphinx
  - sphinxcontrib-napoleon
  - myst-parser
  - sphinx-rtd-theme
  - sphinx-markdown-builder
  - sphinx-needs
  - esbonio
  # CLI
  - typer
  - rich
  - pip
  - pip:
      # The root of a workspace and the places of stelion.yml are located by Hodegos.
      - hodegos @ git+https://github.com/esther-poniatowski/hodegos.git@a151a28010058fda08a652aea345422037ff0d3c
variables:
